name: Aktualizacja tygodniowa danych

on:
  schedule:
    - cron: "0 4 * * 1"        # poniedziałek 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - name: Pamięć podręczna arkuszy PKW (pliki wyborów 2024 są stałe; bez niej każdy przebieg pobierałby 8 MB z PKW)
        uses: actions/cache@v4
        with:
          path: data/jst/src/*_csv.zip
          key: pkw-samorzad2024-csv-v1
      - name: Narzędzia systemowe (pdftotext do treści aktów, tesseract z pakietem polskim do skanów w BIP)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-pol

      - name: Pobierz źródła urzędowe i przelicz dane
        id: update
        run: |
          DATE=$(date -u +%F)
          python3 scripts/weekly-update.py --date "$DATE"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "events=$(python3 -c "import json;print(json.load(open('dist/weekly/summary.json'))['events'])")" >> "$GITHUB_OUTPUT"
          echo "findings=$(python3 -c "import json;print(json.load(open('dist/weekly/summary.json'))['findings'])")" >> "$GITHUB_OUTPUT"
          echo "problem=$(python3 -c "import json;print('1' if json.load(open('dist/weekly/summary.json'))['problem'] else '')")" >> "$GITHUB_OUTPUT"
          cat dist/weekly/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Testy (dane wchodzą tylko wtedy, gdy komplet testów przechodzi)
        id: tests
        if: steps.update.outputs.problem == ''
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Zapisz zmiany w repozytorium
        if: steps.update.outputs.problem == '' && steps.tests.outcome == 'success'
        run: |
          git config user.name "graf-panstwa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pl data/jst
          if git diff --cached --quiet; then echo "Brak zmian w danych."; exit 0; fi
          git commit -m "Aktualizacja tygodniowa ${{ steps.update.outputs.date }}: parlament (zmian: ${{ steps.update.outputs.events }}), samorząd (ponowne sprawdzenie nakładek)"
          # ktoś mógł opublikować w trakcie przebiegu: commit bota idzie na wierzch aktualnego main (przy konflikcie w tych samych plikach przebieg kończy się błędem i zgłoszeniem)
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          git log --oneline -1

      - name: Lista do przejrzenia (akty personalne, podstawy prawne)
        if: steps.update.outputs.findings != '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          awk '/^## Akty prawne/{f=1;next} f' dist/weekly/report.md > body.md
          gh issue create --title "Do przejrzenia: akty prawne, tydzień ${{ steps.update.outputs.date }}" --body-file body.md --label "aktualizacja" || gh issue create --title "Do przejrzenia: akty prawne, tydzień ${{ steps.update.outputs.date }}" --body-file body.md

      - name: Zgłoś problem, jeśli aktualizacja albo testy się nie powiodły
        if: always() && (steps.update.outputs.problem != '' || steps.tests.outcome == 'failure' || steps.update.outcome == 'failure')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "Przebieg: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; echo "Dane w repozytorium NIE zostały zmienione."; echo; [ -f dist/weekly/report.md ] && cat dist/weekly/report.md; } > problem.md
          gh issue create --title "Aktualizacja tygodniowa nie powiodła się (${{ steps.update.outputs.date }})" --body-file problem.md

      - name: Raport testów przy niepowodzeniu
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: "test-results/", retention-days: 7, if-no-files-found: ignore }
