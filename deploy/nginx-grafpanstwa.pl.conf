# /etc/nginx/sites-available/grafpanstwa.pl
# Strona statyczna: /var/www/grafpanstwa.pl. Certyfikat Let's Encrypt wystawiony przez certbot 17.09.2026 (odnawia się sam).
# Uwaga nginx: add_header w location kasuje nagłówki z poziomu server, dlatego komplet jest w każdej lokalizacji.
# Pierwsze wdrożenie na nowym serwerze: najpierw wersja tylko z portem 80 (bez linii ssl_*), potem `deploy-site.sh cert`.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grafpanstwa.pl;

    ssl_certificate /etc/letsencrypt/live/grafpanstwa.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafpanstwa.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/grafpanstwa.pl;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml text/plain;
    gzip_min_length 1024;

    # X-Robots-Tag: do czasu odpowiedzi CivLab strona nie jest indeksowana; zdjąć razem z `build-site.py --index`
    location = /graph.json {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }
}

# www -> domena główna (jeden adres kanoniczny), także po HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.grafpanstwa.pl;
    ssl_certificate /etc/letsencrypt/live/grafpanstwa.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafpanstwa.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://grafpanstwa.pl$request_uri;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name grafpanstwa.pl www.grafpanstwa.pl;
    location /.well-known/acme-challenge/ { root /var/www/grafpanstwa.pl; }
    location / { return 301 https://grafpanstwa.pl$request_uri; }
}
